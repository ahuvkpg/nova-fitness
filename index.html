<!doctype html>

<meta property="og:title" content="Nova Fitness | 6-Week Online Coaching">

<body>

<header class="topbar">
  <a href="#top" class="brand" aria-label="Nova Fitness"><img src="assets/img/logo-light.webp" alt="Nova Fitness" width="132" height="52"></a>
  <div class="topbar-right">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="my" aria-pressed="true" lang="my">မြန်မာ</button>
      <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
    <a href="#apply" class="btn btn-sm" data-cta data-i18n="nav.cta">Start now</a>

</header>

<main id="top">

<!-- HERO -->
<section class="hero">
  <picture class="hero-bg">
    <source srcset="assets/img/nova-hero.webp" type="image/webp">
    <img src="assets/img/nova-hero.jpg" alt="" width="675" height="1200" fetchpriority="high">
  </picture>
  <div class="hero-inner">
    <img class="hero-logo" src="assets/img/logo-light.webp" alt="Nova Fitness" width="420" height="164">
    <p class="kicker" data-i18n="hero.kicker"></p>
    <h1 class="display" data-i18n="hero.title"></h1>
    <p class="lead" data-i18n="hero.sub"></p>
    <p class="pill" data-i18n="hero.pill"></p>
    <div class="cta-row">
      <a href="#apply" class="btn btn-lg" data-cta data-i18n="hero.cta"></a>
      <a href="#how" class="btn btn-ghost" data-i18n="hero.cta2"></a>
    </div>
    <ul class="trust">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10h3v4H2zM19 10h3v4h-3zM5 8h3v8H5zM16 8h3v8h-3zM8 11h8v2H8z"/></svg><span data-i18n="hero.trust1"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 3v13h10V5zm4 14.5a1 1 0 1 0 2 0 1 1 0 0 0-2 0z"/></svg><span data-i18n="hero.trust2"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v11H8l-4 4zM7 8v2h10V8zm0 3v2h7v-2z"/></svg><span data-i18n="hero.trust3"></span></li>
    </ul>
  </div>
</section>

<!-- PAIN / PROMISE -->
<section class="section pain">
  <div class="wrap">
    <p class="kicker reveal" data-i18n="pain.kicker"></p>
    <h2 class="h2 reveal" data-i18n="pain.title"></h2>
    <ul class="pain-list">
      <li class="reveal"><span class="x">✕</span><span data-i18n="pain.1"></span></li>
      <li class="reveal"><span class="x">✕</span><span data-i18n="pain.2"></span></li>
      <li class="reveal"><span class="x">✕</span><span data-i18n="pain.3"></span></li>
      <li class="reveal"><span class="x">✕</span><span data-i18n="pain.4"></span></li>
    </ul>
    <p class="promise metal-card reveal" data-i18n="pain.promise"></p>
  </div>
</section>

<!-- HOW IT WORKS -->
<section class="section how" id="how">
  <div class="wrap">
    <p class="kicker reveal" data-i18n="how.kicker"></p>
    <h2 class="h2 reveal" data-i18n="how.title"></h2>
    <ol class="timeline">
      <li class="reveal"><span class="dot">1</span><div><span class="when" data-i18n="how.s1.when"></span><h3 data-i18n="how.s1.title"></h3><p data-i18n="how.s1.text"></p></div></li>
      <li class="reveal"><span class="dot">2</span><div><span class="when" data-i18n="how.s2.when"></span><h3 data-i18n="how.s2.title"></h3><p data-i18n="how.s2.text"></p></div></li>
      <li class="reveal"><span class="dot">3</span><div><span class="when" data-i18n="how.s3.when"></span><h3 data-i18n="how.s3.title"></h3><p data-i18n="how.s3.text"></p></div></li>
      <li class="reveal"><span class="dot">4</span><div><span class="when" data-i18n="how.s4.when"></span><h3 data-i18n="how.s4.title"></h3><p data-i18n="how.s4.text"></p></div></li>
      <li class="reveal"><span class="dot">5</span><div><span class="when" data-i18n="how.s5.when"></span><h3 data-i18n="how.s5.title"></h3><p data-i18n="how.s5.text"></p></div></li>
      <li class="reveal"><span class="dot">6</span><div><span class="when" data-i18n="how.s6.when"></span><h3 data-i18n="how.s6.title"></h3><p data-i18n="how.s6.text"></p></div></li>
    </ol>
  </div>
</section>

<!-- BODY SCAN -->
<section class="section scan">
  <div class="wrap">
    <p class="kicker reveal" data-i18n="scan.kicker"></p>
    <h2 class="h2 reveal" data-i18n="scan.title"></h2>
    <p class="sub reveal" data-i18n="scan.sub"></p>
    <div class="poses reveal">
      <figure><svg viewBox="0 0 60 120" aria-hidden="true"><circle cx="30" cy="12" r="9"/><path d="M18 26h24l6 34-6 2-4-24v74h-8V74h-0v36h-8V38l-4 24-6-2z"/></svg><figcaption data-i18n="scan.front"></figcaption></figure>
      <figure><svg viewBox="0 0 60 120" aria-hidden="true"><circle cx="32" cy="12" r="9"/><path d="M24 26h14l4 16-2 22-4 0v46h-8V64h-4l-2-22z"/></svg><figcaption data-i18n="scan.side"></figcaption></figure>
      <figure><svg viewBox="0 0 60 120" aria-hidden="true"><circle cx="30" cy="12" r="9"/><path d="M16 26h28l6 34-6 2-4-24v72h-8V74h0v36h-8V38l-4 24-6-2z"/><path d="M30 30v40" stroke="#0a0a0a" stroke-width="1.5"/></svg><figcaption data-i18n="scan.back"></figcaption></figure>
    </div>
    <div class="grid-3">
      <div class="feat metal-card reveal"><span class="ico">%</span><h3 data-i18n="scan.b1.t"></h3><p data-i18n="scan.b1.d"></p></div>
      <div class="feat metal-card reveal"><span class="ico">◆</span><h3 data-i18n="scan.b2.t"></h3><p data-i18n="scan.b2.d"></p></div>
      <div class="feat metal-card reveal"><span class="ico">⚖</span><h3 data-i18n="scan.b3.t"></h3><p data-i18n="scan.b3.d"></p></div>
      <div class="feat metal-card reveal"><span class="ico">◎</span><h3 data-i18n="scan.b4.t"></h3><p data-i18n="scan.b4.d"></p></div>
      <div class="feat metal-card reveal"><span class="ico">⇄</span><h3 data-i18n="scan.b5.t"></h3><p data-i18n="scan.b5.d"></p></div>
      <div class="feat metal-card reveal"><span class="ico">✓</span><h3 data-i18n="scan.b6.t"></h3><p data-i18n="scan.b6.d"></p></div>
    </div>
    <p class="tips reveal" data-i18n="scan.tips"></p>
    <p class="fine reveal" data-i18n="scan.note"></p>
  </div>
</section>

<!-- INCLUDED -->
<section class="section included">
  <div class="wrap narrow">
    <p class="kicker reveal" data-i18n="inc.kicker"></p>
    <h2 class="h2 reveal" data-i18n="inc.title"></h2>
    <ul class="checks">
      <li class="reveal" data-i18n="inc.1"></li>
      <li class="reveal" data-i18n="inc.2"></li>
      <li class="reveal" data-i18n="inc.3"></li>
      <li class="reveal" data-i18n="inc.4"></li>
      <li class="reveal" data-i18n="inc.5"></li>
      <li class="reveal" data-i18n="inc.6"></li>
      <li class="reveal" data-i18n="inc.7"></li>
    </ul>
    <div class="center"><a href="#apply" class="btn btn-lg" data-cta data-i18n="hero.cta"></a></div>
  </div>
</section>

<!-- NOVA -->
<section class="section nova">
  <div class="wrap nova-grid">
    <picture class="nova-main reveal">
      <source srcset="assets/img/nova-coach.webp" type="image/webp">
      <img src="assets/img/nova-coach.jpg" alt="Nova, coach at Nova Fitness" width="675" height="1200" loading="lazy">
    </picture>
    <div class="nova-copy">
      <p class="kicker reveal" data-i18n="nova.kicker"></p>
      <h2 class="h2 reveal" data-i18n="nova.title"></h2>
      <p class="reveal" data-i18n="nova.text"></p>
      <p class="gallery-label reveal" data-i18n="nova.gallery"></p>
      <div class="gallery">
        <picture class="reveal"><source srcset="assets/img/nova-dumbbells.webp" type="image/webp"><img src="assets/img/nova-dumbbells.jpg" alt="Nova training with dumbbells" width="675" height="1200" loading="lazy"></picture>
        <picture class="reveal"><source srcset="assets/img/nova-pullup.webp" type="image/webp"><img src="assets/img/nova-pullup.jpg" alt="Nova doing pull-ups" width="675" height="1200" loading="lazy"></picture>
        <picture class="reveal"><source srcset="assets/img/nova-outdoor.webp" type="image/webp"><img src="assets/img/nova-outdoor.jpg" alt="Nova outdoors" width="394" height="1200" loading="lazy"></picture>
        <picture class="reveal"><source srcset="assets/img/nova-portrait.webp" type="image/webp"><img src="assets/img/nova-portrait.jpg" alt="Nova at the gym" width="675" height="1200" loading="lazy"></picture>
      </div>
    </div>
  </div>
</section>

<!-- CLIENTS -->
<section class="section clients">
  <div class="wrap">
    <p class="kicker reveal" data-i18n="clients.kicker"></p>
    <h2 class="h2 reveal" data-i18n="clients.title"></h2>
    <p class="sub reveal" data-i18n="clients.text"></p>
    <div class="client-grid">
      <figure class="reveal"><picture><source srcset="assets/img/clients-1.webp" type="image/webp"><img src="assets/img/clients-1.jpg" alt="Nova with clients Maotoo and Sansan" width="675" height="1200" loading="lazy"></picture><figcaption data-i18n="clients.cap1"></figcaption></figure>
      <figure class="reveal"><picture><source srcset="assets/img/clients-2.webp" type="image/webp"><img src="assets/img/clients-2.jpg" alt="Nova, Maotoo and Sansan at the gym" width="675" height="1200" loading="lazy"></picture><figcaption data-i18n="clients.cap2"></figcaption></figure>
    </div>
  </div>
</section>

<!-- PRICING -->
<section class="section pricing" id="pricing">
  <div class="wrap">
    <p class="kicker reveal" data-i18n="price.kicker"></p>
    <h2 class="h2 reveal" data-i18n="price.title"></h2>
    <div class="price-card reveal">
      <span class="badge" data-i18n="price.badge"></span>
      <h3 class="price-name" data-i18n="price.name"></h3>
      <div class="price-row">
        <s class="was" data-i18n="price.was"></s>
        <span class="now" data-i18n="price.now"></span>
      </div>
      <p class="price-mmk" data-i18n="price.mmk"></p>
      <p class="price-limit" data-i18n="price.limit"></p>
      <ul class="checks small">
        <li data-i18n="inc.1"></li><li data-i18n="inc.2"></li><li data-i18n="inc.3"></li><li data-i18n="inc.5"></li>
      </ul>
      <a href="#apply" class="btn btn-lg btn-block" data-cta data-i18n="price.cta"></a>
    </div>
    <div class="addon metal-card reveal">
      <h3 data-i18n="price.addon.t"></h3>
      <p data-i18n="price.addon.d"></p>
    </div>

    <div class="pay reveal" id="payment">
      <h3 class="h3" data-i18n="pay.title"></h3>
      <p class="sub" data-i18n="pay.sub"></p>
      <div class="pay-grid">
        <div class="pay-card metal-card">
          <h4><span class="flag">🇹🇭</span> <span data-i18n="pay.thai"></span></h4>
          <dl>
            <dt data-i18n="pay.bank"></dt><dd id="pay-th-bank"></dd>
            <dt data-i18n="pay.name"></dt><dd id="pay-th-name"></dd>
            <dt data-i18n="pay.number"></dt><dd><span id="pay-th-num"></span> <button class="copy" data-copy="pay-th-num" data-i18n="pay.copy"></button></dd>
          </dl>
        </div>
        <div class="pay-card metal-card">
          <h4><span class="flag">🇲🇲</span> <span data-i18n="pay.mm"></span></h4>
          <dl>
            <dt data-i18n="pay.bank"></dt><dd id="pay-mm-bank"></dd>
            <dt data-i18n="pay.name"></dt><dd id="pay-mm-name"></dd>
            <dt data-i18n="pay.number"></dt><dd><span id="pay-mm-num"></span> <button class="copy" data-copy="pay-mm-num" data-i18n="pay.copy"></button></dd>
          </dl>
        </div>
        <div class="pay-card metal-card">
          <h4><span class="flag">⚡</span> <span data-i18n="pay.pp"></span></h4>
          <dl>
            <dt data-i18n="pay.ppid"></dt><dd><span id="pay-pp-id"></span> <button class="copy" data-copy="pay-pp-id" data-i18n="pay.copy"></button></dd>
            <dt data-i18n="pay.name"></dt><dd id="pay-pp-name"></dd>
          </dl>
        </div>
      </div>
      <p class="fine" data-i18n="pay.rate"></p>
    </div>
  </div>
</section>

<!-- APPLY -->
<section class="section apply" id="apply">
  <div class="wrap narrow">
    <p class="kicker reveal" data-i18n="apply.kicker"></p>
    <h2 class="h2 reveal" data-i18n="apply.title"></h2>
    <p class="sub reveal" data-i18n="apply.sub"></p>
    <div class="form-shell">
      <div id="form-slot" class="form-slot" hidden></div>
      <div id="form-placeholder" class="form-placeholder">
        <p data-i18n="apply.placeholder"></p>
        <div class="contact-btns">
          <a class="btn btn-wa" data-link="whatsapp" href="#" target="_blank" rel="noopener">WhatsApp</a>
          <a class="btn btn-ghost" data-link="tiktok" href="#" target="_blank" rel="noopener">TikTok</a>
          <a class="btn btn-ghost" data-link="facebook" href="#" target="_blank" rel="noopener">Messenger</a>
        </div>
      </div>
      <a id="form-open" class="btn btn-lg btn-block" href="#" hidden data-i18n="apply.btn"></a>
    </div>
    <p class="fine center" data-i18n="apply.after"></p>
  </div>
</section>

<!-- FAQ -->

  <div class="wrap narrow">
    <p class="kicker reveal" data-i18n="faq.kicker"></p>
    <h2 class="h2 reveal" data-i18n="faq.title"></h2>

    <details class="reveal"><summary data-i18n="faq.q8"></summary><p data-i18n="faq.a8"></p></details>

<!-- FINAL CTA -->
<section class="section final">
  <div class="wrap narrow center">
    <h2 class="h2 reveal" data-i18n="final.title"></h2>
    <a href="#apply" class="btn btn-lg" data-cta data-i18n="final.cta"></a>
  </div>
</section>
